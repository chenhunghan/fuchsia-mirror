[package]
name = "kernel_features"
version = "0.1.0"
edition = "2024"

[dependencies]
top_crate = { version = "1.0.0", path = "top_crate", features = ["serde"] }

[target.'cfg(kernel)'.dependencies]
top_crate = { version = "1.0.0", path = "top_crate", default-features = false, features = ["small_rng"] }
