# Domains for task-based `/proc` node labeling tests.
attribute test_procfs_task_a;

type test_procfs_initial_t, test_procfs_task_a, test_a;
type test_procfs_dyntransition_t, test_procfs_task_a, test_a;
type test_procfs_exec_t, test_procfs_task_a, test_a;
type test_procfs_unbounded_t, test_procfs_task_a, test_a;
type test_procfs_bounded_t, test_procfs_task_a, test_a;

typebounds test_procfs_unbounded_t test_procfs_bounded_t;

# Allow task-labeling domains to transition, fork, exec, signal, and inspect metadata
# (`getattr`/`search`) of each other's `/proc/<pid>` and `/proc/<pid>/task/<tid>` subtrees.
# Cross-domain `file { read }` is intentionally omitted (while `self:file { open read ... }`
# comes from `test_a`) so pre-opened FDs succeed before a transition and fail with `EACCES` after.
allow test_procfs_task_a test_procfs_task_a:process { setcurrent setexec fork dyntransition transition sigchld sigstop signal sigkill siginh rlimitinh noatsecure share getattr };
allow test_procfs_task_a unconfined_t:process { sigchld };
allow test_procfs_task_a test_procfs_task_a:dir { open read getattr search };
allow test_procfs_task_a test_procfs_task_a:file { getattr };
allow test_procfs_task_a test_procfs_task_a:lnk_file { read getattr };
allow test_procfs_task_a test_procfs_task_a:fifo_file { read write getattr };
allow test_procfs_task_a test_procfs_task_a:fd { use };
neverallow test_procfs_initial_t test_procfs_dyntransition_t:file { read };
neverallow test_procfs_initial_t test_procfs_exec_t:file { read };
neverallow test_procfs_unbounded_t test_procfs_bounded_t:file { read };

# Allow executing `stop_bin` in `data/bin` on both Starnix and Linux.
allow test_procfs_task_a file_t:dir { getattr search };
allow test_procfs_task_a file_t:file { read getattr map execute entrypoint };
allow test_procfs_task_a unlabeled_t:dir { getattr search };
allow test_procfs_task_a unlabeled_t:file { read getattr map execute entrypoint };
allow test_procfs_task_a test_procfs_task_a:capability { dac_read_search dac_override };
policycap nnp_nosuid_transition;
allow test_procfs_task_a test_procfs_task_a:process2 { nosuid_transition };
