# Allow target file/dir types created in `/tmp` to associate with `tmpfs_t`.
allow tmpfs_t self:filesystem { associate };
allow file_like_a tmpfs_t:filesystem { associate };

# Roles and users for testing `u1`, `u2`, `r1`, `r2`, and full MLS ranges (`s0` - `s2:c0.c2`).
role test_constraints_r1;
role test_constraints_r2;
role test_constraints_r3;
role test_constraints_r1 types { test_a file_like_a };
role test_constraints_r2 types { test_a file_like_a };
role test_constraints_r3 types { test_a file_like_a };
role test_r types { file_like_a };
allow unconfined_r test_constraints_r1;
allow unconfined_r test_constraints_r2;
allow unconfined_r test_constraints_r3;
allow test_r test_constraints_r1;
allow test_r test_constraints_r2;
allow test_r test_constraints_r3;
allow test_constraints_r1 test_constraints_r2;

user test_constraints_u1 roles { test_r test_constraints_r1 test_constraints_r2 test_constraints_r3 object_r } level s0 range s0 - s2:c0.c2;
user test_constraints_u2 roles { test_r test_constraints_r1 test_constraints_r2 test_constraints_r3 object_r } level s0 range s0 - s2:c0.c2;
user test_constraints_u3 roles { test_r test_constraints_r1 test_constraints_r2 test_constraints_r3 object_r } level s0 range s0 - s2:c0.c2;

# 1. User attribute equality (`u1 == u2`) and inequality (`u1 != u2`).
type test_constraints_user_s, test_a;
type test_constraints_user_eq_file_t, file_like_a;
type test_constraints_user_ne_file_t, file_like_a;
allow test_constraints_user_s test_constraints_user_eq_file_t:file { open read lock };
allow test_constraints_user_s test_constraints_user_ne_file_t:file { open read };

constrain file { lock } ( u1 == u2 );
constrain file { read } ( t1 == unconfined_a or t2 != test_constraints_user_ne_file_t or u1 != u2 );

# 2. User name sets (`u1 == { ... }`, `u1 != { ... }`, `u2 == { ... }`, `u2 != { ... }`).
type test_constraints_user_set_s, test_a;
type test_constraints_user_set_file_t, file_like_a;
allow test_constraints_user_set_s test_constraints_user_set_file_t:file { open read write };

constrain file { read } ( t1 == unconfined_a or t2 != test_constraints_user_set_file_t or ( u1 == { test_constraints_u1 test_constraints_u2 test_constraints_u3 } and u1 != test_constraints_u3 ) );
constrain file { write } ( t1 == unconfined_a or t2 != test_constraints_user_set_file_t or ( u2 == { test_constraints_u1 test_constraints_u2 test_constraints_u3 } and u2 != test_constraints_u3 ) );

# 3. Role attribute equality (`r1 == r2`) and inequality (`r1 != r2`).
type test_constraints_role_s, test_a;
type test_constraints_role_eq_file_t, file_like_a;
type test_constraints_role_ne_file_t, file_like_a;
allow test_constraints_role_s test_constraints_role_eq_file_t:file { setattr };
allow test_constraints_role_s test_constraints_role_ne_file_t:file { open read };

constrain file { setattr } ( r1 == r2 );
constrain file { read } ( t1 == unconfined_a or t2 != test_constraints_role_ne_file_t or r1 != r2 );

# 4. Role name sets (`r1 == { ... }`, `r1 != { ... }`, `r2 == { ... }`, `r2 != { ... }`).
type test_constraints_role_set_s, test_a;
type test_constraints_role_set_file_t, file_like_a;
allow test_constraints_role_set_s test_constraints_role_set_file_t:file { open read write };

constrain file { read } ( t1 == unconfined_a or t2 != test_constraints_role_set_file_t or ( r1 == { test_constraints_r1 test_constraints_r2 test_constraints_r3 } and r1 != test_constraints_r3 ) );
constrain file { write } ( t1 == unconfined_a or t2 != test_constraints_role_set_file_t or ( r2 == { object_r test_constraints_r1 test_constraints_r2 } and r2 != test_constraints_r2 ) );

# 5. Type attribute equality (`t1 == t2`) and inequality (`t1 != t2`).
type test_constraints_same_type_t, test_a, file_like_a;
type test_constraints_diff_type_file_t, file_like_a;
allow test_constraints_same_type_t self:file { open write append };
allow test_constraints_same_type_t test_constraints_diff_type_file_t:file { open write append };

constrain file { append } ( t1 == t2 );
constrain file { write } ( t1 != test_constraints_same_type_t or t1 != t2 );

# 6. Type and attribute name sets (`t1 == { ... }`, `t2 != { ... }`).
attribute test_constraints_allowed_src_a;
attribute test_constraints_denied_tgt_a;
type test_constraints_type_attr_s, test_a, test_constraints_allowed_src_a;
type test_constraints_type_listed_s, test_a;
type test_constraints_type_unlisted_s, test_a;
type test_constraints_type_ok_file_t, file_like_a;
type test_constraints_type_blocked_file_t, file_like_a, test_constraints_denied_tgt_a;

allow test_constraints_type_attr_s test_constraints_type_ok_file_t:file { open read };
allow test_constraints_type_attr_s test_constraints_type_blocked_file_t:file { open read };
allow test_constraints_type_listed_s test_constraints_type_ok_file_t:file { open read };
allow test_constraints_type_unlisted_s test_constraints_type_ok_file_t:file { open read };

constrain file { read } ( t1 == unconfined_a or t2 != { test_constraints_type_ok_file_t test_constraints_type_blocked_file_t } or ( t1 == { test_constraints_allowed_src_a test_constraints_type_listed_s } and t2 != test_constraints_denied_tgt_a ) );

# 7. Boolean operators (`not`, `and`, `or`) and nested expressions.
type test_constraints_bool_regular_s, test_a;
type test_constraints_bool_override_s, test_a;
type test_constraints_bool_file_t, file_like_a;
allow test_constraints_bool_regular_s test_constraints_bool_file_t:file { open read };
allow test_constraints_bool_override_s test_constraints_bool_file_t:file { open read };

constrain file { read } ( t1 == unconfined_a or t2 != test_constraints_bool_file_t or ( ( u1 == u2 and r1 == r2 ) or ( t1 == test_constraints_bool_override_s and not ( u2 == test_constraints_u3 ) ) ) );

# 8. Multiple `constrain` statements on the same class and permission (`file { link }`), plus
# `dontaudit` suppression of a constraint denial.
type test_constraints_multi_ok_s, test_a;
type test_constraints_multi_bad_type_s, test_a;
type test_constraints_multi_dontaudit_s, test_a;
type test_constraints_multi_file_t, file_like_a;
allow test_constraints_multi_ok_s tmpfs_t:dir { search write add_name remove_name };
allow test_constraints_multi_bad_type_s tmpfs_t:dir { search write add_name remove_name };
allow test_constraints_multi_dontaudit_s tmpfs_t:dir { search write add_name remove_name };
allow test_constraints_multi_ok_s test_constraints_multi_file_t:file { link unlink };
allow test_constraints_multi_bad_type_s test_constraints_multi_file_t:file { link unlink };
allow test_constraints_multi_dontaudit_s test_constraints_multi_file_t:file { link unlink };
dontaudit test_constraints_multi_dontaudit_s test_constraints_multi_file_t:file { link };

constrain file { link } ( u1 == u2 );
constrain file { link } ( t1 != test_constraints_multi_bad_type_s );

# 9. Inherited `common file` permissions vs class-specific permissions (`dir`).
type test_constraints_dir_s, test_a;
type test_constraints_dir_t, file_like_a;
allow test_constraints_dir_s tmpfs_t:dir { search write add_name remove_name };
allow test_constraints_dir_s test_constraints_dir_t:dir { getattr open read search rmdir };

constrain dir { read } ( u1 == u2 );
constrain dir { rmdir } ( r1 == r2 );

# 10. `mlsconstrain` with `eq` (`==`) and `!=` across `l1`, `h1`, `l2`, `h2`.
type test_constraints_mls_eq_s, test_a;
type test_constraints_mls_eq_file_t, file_like_a;
allow test_constraints_mls_eq_s test_constraints_mls_eq_file_t:file { open read write };

mlsconstrain file { read } ( t1 == unconfined_a or t2 != test_constraints_mls_eq_file_t or l1 eq l2 );
mlsconstrain file { write } ( t1 == unconfined_a or t2 != test_constraints_mls_eq_file_t or ( l1 != h1 and l2 == h2 ) );

# 11. `mlsconstrain` with `dom` and `domby` across `l1`, `h1`, `l2`, `h2`.
type test_constraints_mls_dom_s, test_a;
type test_constraints_mls_dom_file_t, file_like_a;
allow test_constraints_mls_dom_s test_constraints_mls_dom_file_t:file { open read write };

mlsconstrain file { read } ( t1 == unconfined_a or t2 != test_constraints_mls_dom_file_t or ( l1 dom h2 and h1 dom h2 ) );
mlsconstrain file { write } ( t1 == unconfined_a or t2 != test_constraints_mls_dom_file_t or ( l1 domby l2 and h1 dom l2 and l1 domby h2 ) );

# 12. `mlsconstrain` with `incomp` across incomparable category/sensitivity levels.
type test_constraints_mls_incomp_s, test_a;
type test_constraints_mls_incomp_file_t, file_like_a;
allow test_constraints_mls_incomp_s test_constraints_mls_incomp_file_t:file { open read write };

mlsconstrain file { read } ( t1 == unconfined_a or t2 != test_constraints_mls_incomp_file_t or not ( l1 incomp l2 ) );
mlsconstrain file { write } ( t1 == unconfined_a or t2 != test_constraints_mls_incomp_file_t or ( l1 incomp l2 and h1 incomp h2 ) );
