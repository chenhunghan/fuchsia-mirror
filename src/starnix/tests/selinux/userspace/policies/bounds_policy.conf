# Allow target file types created in `/tmp` for bounds tests to associate with `tmpfs_t`.
allow tmpfs_t self:filesystem { associate };
allow file_like_a tmpfs_t:filesystem { associate };

# Unbounded subject domain used to verify standalone target bounds and negative bounds cases.
type test_bounds_unbounded_s, test_a;

# Paired `(source, target)` bounds (`parent -> child` for both subject and object types).
# Notice `test_bounds_parent_s` intentionally has permissions on `test_bounds_parent_file_t` and
# NOT on `test_bounds_child_file_t`.
type test_bounds_parent_s, test_a;
type test_bounds_child_s, test_a;
typebounds test_bounds_parent_s test_bounds_child_s;

type test_bounds_parent_file_t, file_like_a;
type test_bounds_child_file_t, file_like_a;
typebounds test_bounds_parent_file_t test_bounds_child_file_t;

allow test_bounds_parent_s test_bounds_parent_file_t:file { getattr open read };
allow test_bounds_child_s test_bounds_child_file_t:file { getattr open read };
neverallow test_bounds_parent_s test_bounds_child_file_t:file *;

# Standalone `(unbounded_s, child_t)` must not be bounded by `(unbounded_s, parent_t)`.
allow test_bounds_unbounded_s test_bounds_child_file_t:file { getattr open read };
neverallow test_bounds_unbounded_s test_bounds_parent_file_t:file *;

# Unequal bounds depth with deeper source (`gp_s -> mid_s -> deep_child_s`) and shallower target
# (`mid_file_t -> shallow_child_file_t`).
type test_bounds_gp_s, test_a;
type test_bounds_mid_s, test_a;
type test_bounds_deep_child_s, test_a;
typebounds test_bounds_gp_s test_bounds_mid_s;
typebounds test_bounds_mid_s test_bounds_deep_child_s;

type test_bounds_mid_file_t, file_like_a;
type test_bounds_shallow_child_file_t, file_like_a;
typebounds test_bounds_mid_file_t test_bounds_shallow_child_file_t;

allow test_bounds_gp_s test_bounds_mid_file_t:file { getattr open read };
allow test_bounds_mid_s test_bounds_mid_file_t:file { getattr open read };
allow test_bounds_deep_child_s test_bounds_shallow_child_file_t:file { getattr open read };
neverallow test_bounds_gp_s test_bounds_shallow_child_file_t:file *;
neverallow test_bounds_mid_s test_bounds_shallow_child_file_t:file *;

# Unequal bounds depth with shallower source (`shallow_parent_s -> shallow_child_s`) and deeper
# target (`gp_file_t -> mid2_file_t -> deep_child_file_t`). Bounds traversal stops once the source
# becomes unbounded (`shallow_parent_s`).
type test_bounds_shallow_parent_s, test_a;
type test_bounds_shallow_child_s, test_a;
typebounds test_bounds_shallow_parent_s test_bounds_shallow_child_s;

type test_bounds_gp_file_t, file_like_a;
type test_bounds_mid2_file_t, file_like_a;
type test_bounds_deep_child_file_t, file_like_a;
typebounds test_bounds_gp_file_t test_bounds_mid2_file_t;
typebounds test_bounds_mid2_file_t test_bounds_deep_child_file_t;

allow test_bounds_shallow_parent_s test_bounds_mid2_file_t:file { getattr open read };
allow test_bounds_shallow_child_s test_bounds_deep_child_file_t:file { getattr open read };
neverallow test_bounds_shallow_parent_s test_bounds_gp_file_t:file *;
neverallow test_bounds_shallow_parent_s test_bounds_deep_child_file_t:file *;

# Multi-level bounds chain of maximum valid depth (3 hops / 4 types) for testing
# transitive `is_bounded_by` in multi-threaded `dyntransition` and `PR_SET_NO_NEW_PRIVS` `execve`.
attribute test_bounds_chain_a;
type test_bounds_chain_0_t, test_bounds_chain_a, test_a;
type test_bounds_chain_1_t, test_bounds_chain_a, test_a;
type test_bounds_chain_2_t, test_bounds_chain_a, test_a;
type test_bounds_chain_3_t, test_bounds_chain_a, test_a;
typebounds test_bounds_chain_0_t test_bounds_chain_1_t;
typebounds test_bounds_chain_1_t test_bounds_chain_2_t;
typebounds test_bounds_chain_2_t test_bounds_chain_3_t;

type test_bounds_exec_file_t, file_like_a;
allow test_bounds_chain_a self:process { setexec };
allow test_bounds_chain_0_t test_bounds_chain_a:process { transition };
allow test_bounds_chain_0_t test_bounds_unbounded_s:process { transition };
allow test_bounds_chain_a test_bounds_exec_file_t:file { entrypoint execute read getattr map };
allow test_bounds_unbounded_s test_bounds_exec_file_t:file { entrypoint execute read getattr map };
allow test_bounds_chain_a test_bounds_chain_a:fd { use };
allow test_bounds_unbounded_s test_bounds_chain_0_t:fd { use };
allow test_bounds_chain_a test_bounds_chain_a:process { siginh rlimitinh noatsecure share };
allow test_bounds_chain_0_t test_bounds_unbounded_s:process { siginh rlimitinh noatsecure share };
allow test_bounds_chain_a file_t:file { read getattr map execute };
allow test_bounds_chain_a unlabeled_t:file { read getattr map execute };
allow test_bounds_chain_a self:lnk_file { read };
allow test_bounds_unbounded_s file_t:file { read getattr map execute };
allow test_bounds_unbounded_s unlabeled_t:file { read getattr map execute };
allow test_bounds_unbounded_s self:lnk_file { read };
allow test_bounds_chain_a tmpfs_t:dir { getattr };
allow test_bounds_unbounded_s tmpfs_t:dir { getattr };

# Constraints (`t1`, attribute on child only, multi-level inheritance, paired `t2`, and
# `mlsconstrain`) bounded via `typebounds`.
attribute test_bounds_constrain_child_only_a;
type test_bounds_constrain_parent_s, test_a;
type test_bounds_constrain_child_s, test_a, test_bounds_constrain_child_only_a;
typebounds test_bounds_constrain_parent_s test_bounds_constrain_child_s;

type test_bounds_constrain_file_t, file_like_a;
allow test_bounds_constrain_parent_s test_bounds_constrain_file_t:file { getattr open read append };
allow test_bounds_constrain_child_s test_bounds_constrain_file_t:file { getattr open read append };

# Multi-level constraint inheritance (`gp_s -> mid_s -> deep_s`) where `gp_s` is denied.
type test_bounds_constrain_gp_s, test_a;
type test_bounds_constrain_mid_s, test_a;
type test_bounds_constrain_deep_s, test_a;
typebounds test_bounds_constrain_gp_s test_bounds_constrain_mid_s;
typebounds test_bounds_constrain_mid_s test_bounds_constrain_deep_s;

type test_bounds_constrain_deep_file_t, file_like_a;
allow test_bounds_constrain_gp_s test_bounds_constrain_deep_file_t:file { getattr open read };
allow test_bounds_constrain_mid_s test_bounds_constrain_deep_file_t:file { getattr open read };
allow test_bounds_constrain_deep_s test_bounds_constrain_deep_file_t:file { getattr open read };

# Dedicated bounded subject pair for `t2` target constraint so `t1` constraints on `read` do not
# mask paired target bounds checks.
type test_bounds_constrain_t2_parent_s, test_a;
type test_bounds_constrain_t2_child_s, test_a;
typebounds test_bounds_constrain_t2_parent_s test_bounds_constrain_t2_child_s;

type test_bounds_constrain_target_parent_t, file_like_a;
type test_bounds_constrain_target_child_t, file_like_a;
typebounds test_bounds_constrain_target_parent_t test_bounds_constrain_target_child_t;

allow test_bounds_constrain_t2_parent_s test_bounds_constrain_file_t:file { getattr open read };
allow test_bounds_constrain_t2_child_s test_bounds_constrain_file_t:file { getattr open read };
allow test_bounds_constrain_t2_parent_s test_bounds_constrain_target_parent_t:file { getattr open read };
allow test_bounds_constrain_t2_child_s test_bounds_constrain_target_child_t:file { getattr open read };
allow test_bounds_unbounded_s test_bounds_constrain_target_child_t:file { getattr open read };

constrain file { read } ( t1 != test_bounds_constrain_parent_s and t1 != test_bounds_constrain_gp_s );
constrain file { append } ( t1 == test_bounds_constrain_child_only_a or t1 != test_bounds_constrain_parent_s );
constrain file { read } ( t2 != test_bounds_constrain_target_parent_t );

# MLS constraint (`mlsconstrain`) with child-only attribute bypass blocked by `typebounds`.
attribute test_bounds_mls_trusted_a;
type test_bounds_mls_parent_s, test_a;
type test_bounds_mls_child_s, test_a, test_bounds_mls_trusted_a;
typebounds test_bounds_mls_parent_s test_bounds_mls_child_s;

type test_bounds_mls_unbounded_trusted_s, test_a, test_bounds_mls_trusted_a;

type test_bounds_mls_file_t, file_like_a;
allow test_bounds_mls_parent_s test_bounds_mls_file_t:file { getattr open write };
allow test_bounds_mls_child_s test_bounds_mls_file_t:file { getattr open write };
allow test_bounds_mls_unbounded_trusted_s test_bounds_mls_file_t:file { getattr open write };

mlsconstrain file { write } ( l1 dom l2 or t1 == test_bounds_mls_trusted_a or t1 == unconfined_a );

# Extended permissions (`allowxperm`) with `typebounds`: base `ioctl` is bounded, while xperm
# bitmaps themselves are not intersected across `typebounds`.
type test_bounds_xperm_parent_s, test_a;
type test_bounds_xperm_child_s, test_a;
typebounds test_bounds_xperm_parent_s test_bounds_xperm_child_s;

type test_bounds_xperm_file_t, file_like_a;
allow test_bounds_xperm_parent_s test_bounds_xperm_file_t:file { getattr open read ioctl };
allow test_bounds_xperm_child_s test_bounds_xperm_file_t:file { getattr open read ioctl };
allowxperm test_bounds_xperm_parent_s test_bounds_xperm_file_t:file ioctl { 0xabcd };
allowxperm test_bounds_xperm_child_s test_bounds_xperm_file_t:file ioctl { 0xabce };

# `dontaudit` and `permissive` remain per-domain and are neither inherited nor masked across
# `typebounds`.
type test_bounds_audit_parent_s, test_a;
type test_bounds_audit_child_s, test_a;
typebounds test_bounds_audit_parent_s test_bounds_audit_child_s;
permissive test_bounds_audit_parent_s;

type test_bounds_permissive_parent_s, test_a;
type test_bounds_permissive_child_s, test_a;
typebounds test_bounds_permissive_parent_s test_bounds_permissive_child_s;
permissive test_bounds_permissive_child_s;

type test_bounds_audit_file_t, file_like_a;
allow test_bounds_audit_parent_s test_bounds_audit_file_t:file { open read };
allow test_bounds_audit_child_s test_bounds_audit_file_t:file { open read };
dontaudit test_bounds_audit_parent_s test_bounds_audit_file_t:file { write };
dontaudit test_bounds_audit_child_s test_bounds_audit_file_t:file { append };
dontaudit test_bounds_permissive_child_s test_bounds_audit_file_t:file { open read };
