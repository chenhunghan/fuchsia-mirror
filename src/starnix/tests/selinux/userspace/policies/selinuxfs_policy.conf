type test_selinuxfs_t;

role test_selinuxfs_r;
role test_selinuxfs_r types { test_selinuxfs_t };

# General "user" for use in SELinuxFS tests. The context
#   test_selinuxfs_u:test_selinuxfs_r:test_selinuxfs_t:s0
# should remain boring, i.e. with no interesting transition rules, etc, applied.
#
# Used to verify that the "context" API validates the SELinux Security Context fields have values
# permitted by policy.
user test_selinuxfs_u roles { test_selinuxfs_r } level s0 range s0 - s2:c0.c2;

# Used to verify that the user-permitted sensitivity and categories are enforced.
user test_selinuxfs_limited_level_u roles { test_selinuxfs_r } level s0:c0 range s0:c0 - s0:c0.c1;

# Used by "create" tests to represent a distinguishable target context, i.e:
#   test_selinuxfs_create_target_u:test_selinuxfs_create_target_r:test_selinuxfs_create_target_t:s0
type test_selinuxfs_create_target_t;
role test_selinuxfs_create_target_r;
role test_selinuxfs_create_target_r types { test_selinuxfs_create_target_t };
role test_selinuxfs_r types { test_selinuxfs_create_target_t };
user test_selinuxfs_create_target_u roles { test_selinuxfs_r test_selinuxfs_create_target_r object_r } level s0 range s0 - s2:c0.c2;

# Used by "create" tests to validate the "glblub" default range, under which the range of a new
# object is the intersection of the source and target ranges.
class test_selinuxfs_glblub_class
class test_selinuxfs_glblub_class { myperm1 }
default_range test_selinuxfs_glblub_class glblub;

# Used by "access" tests to validate handling of non-kernel class permissions.
class test_selinuxfs_target_class
class test_selinuxfs_target_class { myperm1 myperm2 myperm3 myperm4 }
type test_selinuxfs_access_no_perms_target_t;
type test_selinuxfs_access_myperm1_target_t;
type test_selinuxfs_access_myperm1234_target_t;
type test_selinuxfs_access_all_target_t;
type test_selinuxfs_access_permissive_t;
type test_selinuxfs_access_audit_all_target_t;
type test_selinuxfs_access_audit_none_target_t;
permissive test_selinuxfs_access_permissive_t;
role test_selinuxfs_r types { test_selinuxfs_access_permissive_t };
allow test_selinuxfs_t test_selinuxfs_access_myperm1_target_t:test_selinuxfs_target_class { myperm1 };
allow test_selinuxfs_t test_selinuxfs_access_myperm1234_target_t:test_selinuxfs_target_class { myperm1 myperm2 myperm3 myperm4 };
allow test_selinuxfs_t test_selinuxfs_access_all_target_t:test_selinuxfs_target_class *;
neverallow test_selinuxfs_t test_selinuxfs_access_no_perms_target_t:test_selinuxfs_target_class *;
auditallow test_selinuxfs_t test_selinuxfs_access_audit_all_target_t:test_selinuxfs_target_class *;
dontaudit test_selinuxfs_t test_selinuxfs_access_audit_none_target_t:test_selinuxfs_target_class *;

# Used by "access" tests to validate cross-role process transition checks.
type test_selinuxfs_access_process_target_t;
role test_selinuxfs_access_allowed_r;
role test_selinuxfs_access_denied_r;
role test_selinuxfs_r types { test_selinuxfs_access_process_target_t };
role test_selinuxfs_access_allowed_r types { test_selinuxfs_access_process_target_t };
role test_selinuxfs_access_denied_r types { test_selinuxfs_access_process_target_t };
user test_selinuxfs_access_u roles { test_selinuxfs_r test_selinuxfs_access_allowed_r test_selinuxfs_access_denied_r } level s0 range s0 - s2:c0.c2;
allow test_selinuxfs_r test_selinuxfs_access_allowed_r;
allow test_selinuxfs_t test_selinuxfs_access_process_target_t:process { fork transition dyntransition };

# Used to validate "read_policy" permission requirement.
type test_policy_read_denied_t, domain_a, file_like_a, test_a;
role unconfined_r types { test_policy_read_denied_t };
neverallow test_policy_read_denied_t unconfined_t:security { read_policy };

# Used by "booleans" tests to validate conditional policy rules and boolean commits.
bool test_selinuxfs_bool_first true;
bool test_selinuxfs_bool_second false;
bool test_selinuxfs_bool_third true;

type test_selinuxfs_cond_source_t;
type test_selinuxfs_cond_target_t;
type test_selinuxfs_cond_create_true_t;
type test_selinuxfs_cond_create_false_t;
role test_selinuxfs_r types { test_selinuxfs_cond_source_t };

allow test_selinuxfs_cond_source_t test_selinuxfs_cond_target_t:file { getattr };

if (test_selinuxfs_bool_first) {
  allow test_selinuxfs_cond_source_t test_selinuxfs_cond_target_t:file { read };
  type_transition test_selinuxfs_cond_source_t test_selinuxfs_cond_target_t:file test_selinuxfs_cond_create_true_t;
} else {
  allow test_selinuxfs_cond_source_t test_selinuxfs_cond_target_t:file { open };
  type_transition test_selinuxfs_cond_source_t test_selinuxfs_cond_target_t:file test_selinuxfs_cond_create_false_t;
}

if (test_selinuxfs_bool_first && !test_selinuxfs_bool_second) {
  allow test_selinuxfs_cond_source_t test_selinuxfs_cond_target_t:file { write };
}

if (test_selinuxfs_bool_second || (test_selinuxfs_bool_first ^ test_selinuxfs_bool_third)) {
  allow test_selinuxfs_cond_source_t test_selinuxfs_cond_target_t:file { execute };
}

if (test_selinuxfs_bool_first == test_selinuxfs_bool_third) {
  allow test_selinuxfs_cond_source_t test_selinuxfs_cond_target_t:file { append };
  auditallow test_selinuxfs_cond_source_t test_selinuxfs_cond_target_t:file { setattr };
}

if (test_selinuxfs_bool_first != test_selinuxfs_bool_third) {
  dontaudit test_selinuxfs_cond_source_t test_selinuxfs_cond_target_t:file { lock };
}
